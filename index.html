<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Khel Bharat Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Bengali:wght@500;700&family=Noto+Sans+Telugu:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed canvas world; DOM glass layers for hub, intro, HUD and results. Committed look: neon heritage night (dark only). */
:root{
  --bg:#0b0420;--fg:#fff4e6;--muted:#bba9dc;--saffron:#ff9f1c;--rani:#ff2e88;--peacock:#00d1c1;--marigold:#ffd23f;--red:#ff3b5c;
  --glass:rgba(18,7,44,.74);--line:rgba(255,255,255,.14);
  --display:'Teko','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Bengali','Noto Sans Telugu',system-ui,sans-serif;
  --body:'Rajdhani','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Bengali','Noto Sans Telugu',system-ui,sans-serif;
  color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:600 18px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app.play canvas{cursor:none}
#app.gilli canvas{cursor:pointer}
.fxl{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(3,0,14,.7) 100%)}
#scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
.disp{font-family:var(--display);font-weight:600;line-height:.9;letter-spacing:.02em}
html:not([lang=en]):not([lang=hi]) .disp{font-weight:700;line-height:1.15;letter-spacing:0}
/* hub */
#hub{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;transition:opacity .5s}
#hub.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,rgba(11,4,32,.92),rgba(11,4,32,.55) 75%,transparent);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font:700 26px/1 var(--display);letter-spacing:.06em;color:var(--marigold);text-shadow:0 0 14px rgba(255,159,28,.6)}
.brand svg{width:32px;height:32px}
.langs{display:flex;gap:3px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);max-width:100%;overflow-x:auto}
.langs button{border:0;background:none;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.langs button[aria-pressed=true]{background:var(--saffron);color:#1d0a00}
.ib{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;backdrop-filter:blur(6px)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{border-color:var(--marigold);box-shadow:0 0 14px rgba(255,210,63,.45)}
.hero{padding-block:clamp(28px,8vh,90px) 18px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.hero h1{margin:0;font-size:clamp(72px,16vw,190px);font-family:var(--display);font-weight:700;line-height:.8;letter-spacing:.03em;filter:drop-shadow(0 0 26px rgba(255,46,136,.55))}
.hero h1 span{display:inline-block;background:linear-gradient(180deg,#fff7d6 0%,var(--marigold) 35%,var(--saffron) 60%,var(--rani) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:drop .9s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*60ms)}
html:not([lang=en]) .hero h1{line-height:1.05;font-size:clamp(56px,12vw,140px)}
@keyframes drop{from{opacity:0;transform:translateY(-60px) scale(1.5) rotate(-6deg);filter:blur(8px)}}
.hero p{margin:0;max-width:34em;font-size:clamp(18px,2.4vw,24px);color:var(--fg);text-shadow:0 2px 12px #000;animation:rise .8s .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;animation:rise .8s .7s both}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.chip b{color:var(--marigold)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;padding-block:22px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(8px)}
.gcard{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;animation:rise .7s both;animation-delay:calc(.8s + var(--i)*.1s)}
.gcard:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 14px 44px -10px var(--c)}
.gcard .art{height:140px;display:grid;place-items:center;background:radial-gradient(circle at 50% 120%,var(--c),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.gcard .art svg{width:110px;height:110px;filter:drop-shadow(0 0 10px var(--c))}
.gcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard h3{margin:0;font:700 36px/1 var(--display);color:var(--c)}
html:not([lang=en]):not([lang=hi]) .gcard h3{font-size:26px;line-height:1.2}
.gcard p{margin:0;color:var(--muted);font-size:16px;flex:1}
.gcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--muted)}
.gcard .meta b{color:var(--fg)}
.go{background:var(--c);color:#14041f;border-radius:999px;padding:4px 16px;font-weight:700}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;padding:18px;margin-block:8px 18px}
.why h2{margin:0 0 6px;font:700 34px/1 var(--display);color:var(--marigold)}
.why p{margin:0;color:var(--muted)}
.raglist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.raglist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.raglist b{color:var(--fg)}
footer{color:var(--muted);font-size:14px;text-align:center;padding-block:6px 30px}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;transition:opacity .4s}
#hud.off{opacity:0;visibility:hidden}
.hl,.hr{display:flex;flex-direction:column;gap:0}
.hr{align-items:flex-end}
.lbl{font:600 15px var(--display);letter-spacing:.25em;color:var(--muted)}
#score{font:700 clamp(40px,7vw,72px)/.9 var(--display);text-shadow:0 0 18px var(--marigold),0 0 40px rgba(255,159,28,.45);font-variant-numeric:tabular-nums}
#mult{font:600 clamp(18px,3vw,28px) var(--display);color:var(--marigold);text-shadow:0 0 12px var(--saffron);opacity:.35;transform-origin:left center}
#mult.on{opacity:1}
#mult.pop{animation:pop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{40%{transform:scale(1.6)}}
#best{font:700 clamp(22px,3vw,32px)/1 var(--display);color:var(--rani);text-shadow:0 0 12px var(--rani);font-variant-numeric:tabular-nums}
#lives{display:flex;gap:8px;margin-top:8px;min-height:16px}
#lives i{width:15px;height:15px;transform:rotate(45deg);background:var(--marigold);box-shadow:0 0 12px var(--saffron),0 0 24px var(--saffron);border-radius:3px;transition:all .3s}
#lives i.lost{background:transparent;box-shadow:inset 0 0 0 2px var(--red);transform:rotate(45deg) scale(.7);opacity:.7}
.tools{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#meterWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(56vw,420px);display:flex;flex-direction:column;align-items:center;gap:4px}
#meter{width:100%;height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--peacock),var(--marigold));box-shadow:0 0 14px var(--marigold);transition:width .12s}
#meterWrap.ready #meter i{background:linear-gradient(90deg,var(--marigold),var(--rani));animation:glow .5s infinite alternate}
@keyframes glow{to{filter:brightness(1.6)}}
#meterTxt{font:600 16px var(--display);letter-spacing:.25em;color:var(--muted)}
#meterWrap.ready #meterTxt{color:var(--marigold);text-shadow:0 0 12px var(--saffron);animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.5}}
/* overlays */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto;transition:opacity .45s,transform .55s cubic-bezier(.2,.9,.2,1)}
.screen.hide{opacity:0;transform:scale(1.06);pointer-events:none;visibility:hidden;transition:opacity .35s,transform .35s,visibility 0s .35s}
.panel{width:min(100%,880px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin:auto}
.panel h2{margin:0;font-size:clamp(56px,11vw,120px);color:var(--c,var(--marigold));text-shadow:0 0 26px var(--c,var(--saffron))}
.panel .tag{margin:0;font-size:clamp(17px,2.4vw,22px);max-width:36em;text-shadow:0 2px 10px #000}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;width:100%;text-align:left}
.cols .card{padding:16px 18px}
.card h3{margin:0 0 6px;font:600 22px var(--display);letter-spacing:.12em;color:var(--c,var(--marigold))}
html:not([lang=en]) .card h3{letter-spacing:0}
.card p{margin:0;font-size:17px;line-height:1.5}
.raga{margin-top:10px!important;color:var(--muted);font-size:15px!important}
.raga b{color:var(--marigold)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta{border:0;border-radius:14px;padding:12px 44px;font:700 30px/1 var(--display);letter-spacing:.12em;color:#1d0a00;background:linear-gradient(90deg,var(--marigold),var(--saffron));box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 30px rgba(255,159,28,.7);transition:transform .15s;animation:beat 1.2s infinite}
.cta:hover{transform:scale(1.06)}.cta:active{transform:scale(.96)}
.cta.alt{background:linear-gradient(90deg,var(--rani),#ff7bb7);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 0 30px rgba(255,46,136,.7)}
@keyframes beat{50%{transform:scale(1.04)}}
.ghost{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:12px 26px;font:600 26px/1 var(--display);letter-spacing:.1em}
.ghost:hover{border-color:var(--fg)}
.hint{margin:0;color:var(--muted);font-size:15px}
kbd{font:600 14px var(--body);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:1px 8px;background:rgba(255,255,255,.08)}
#over .big{font:700 clamp(70px,15vw,150px)/.85 var(--display);text-shadow:0 0 26px var(--marigold);font-variant-numeric:tabular-nums}
.nb{font:700 26px var(--display);letter-spacing:.2em;color:#1d0a00;background:linear-gradient(90deg,var(--marigold),var(--rani));padding:6px 22px 2px;border-radius:99px;box-shadow:0 0 30px var(--saffron);animation:beat .7s infinite}
.bestl{font:600 20px var(--display);letter-spacing:.2em;color:var(--rani)}
.fact{width:min(100%,640px);text-align:left;padding:16px 18px;--c:var(--peacock)}
#pause h2{font-size:clamp(50px,10vw,100px)}
@media (max-width:600px){.cta{padding:12px 30px}.hero{padding-top:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head><body>
<div id="app">
  <canvas id="c" aria-label="Game canvas"></canvas>
  <div class="fxl" id="scan"></div><div class="fxl" id="vig"></div>

  <div id="hud" class="off">
    <div class="hl"><div class="lbl" data-t="score"></div><div id="score">0</div><div id="mult">×1</div></div>
    <div class="hr"><div class="lbl" data-t="best"></div><div id="best">0</div><div id="lives"></div></div>
    <div class="tools">
      <button class="ib" id="homeBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7M6 9.5V20h12V9.5"/></svg></button>
      <button class="ib muteBtn" aria-label="Sound (M)"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="snd" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
      <button class="ib" id="pauseBtn" aria-label="Pause (P)"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
    <div id="meterWrap"><div id="meter"><i></i></div><span id="meterTxt"></span></div>
  </div>

  <section id="hub">
    <div class="top"><div class="wrap">
      <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#ffd23f" stroke-width="2.4"><circle cx="20" cy="20" r="16"/><circle cx="20" cy="20" r="4"/><path d="M20 4v32M4 20h32M8.7 8.7l22.6 22.6M31.3 8.7 8.7 31.3"/></g></svg><span id="brandTxt">KHEL BHARAT</span></div>
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
      <button class="ib muteBtn" aria-label="Sound (M)"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="snd" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    </div></div>
    <div class="wrap">
      <div class="hero"><h1 id="heroTitle"></h1><p id="heroTag"></p>
        <div class="chips"><span class="chip">Smart India Hackathon 2026 · <b>PS 26208</b> · Toys &amp; Games</span><span class="chip" id="ptsChip"></span></div></div>
      <div class="cards" id="cards"></div>
      <div class="card why"><div><h2 id="whyH"></h2><p id="whyP"></p></div><ul class="raglist" id="ragList"></ul></div>
      <footer id="foot"></footer>
    </div>
  </section>

  <section id="intro" class="screen hide"><div class="panel">
    <h2 class="disp" id="iName"></h2><p class="tag" id="iTag"></p>
    <div class="cols"><article class="card"><h3 data-t="history"></h3><p id="iHist"></p></article>
      <article class="card"><h3 data-t="how"></h3><p id="iHow"></p><p class="raga" id="iRaga"></p></article></div>
    <div class="row"><button class="cta disp" id="startBtn" data-t="start"></button><button class="ghost disp" id="introBack" data-t="back"></button></div>
    <p class="hint"><kbd>Space</kbd> / <kbd>Enter</kbd></p>
  </div></section>

  <section id="over" class="screen hide" aria-live="polite"><div class="panel">
    <h2 class="disp" id="oTitle" data-t="over"></h2>
    <div class="big" id="oScore">0</div>
    <div class="nb disp" id="oNew" data-t="newBest" hidden></div>
    <div class="bestl"><span data-t="best"></span> <span id="oBest"></span></div>
    <article class="card fact"><h3 data-t="didyou"></h3><p id="oFact"></p></article>
    <div class="row"><button class="cta alt disp" id="retryBtn" data-t="retry"></button><button class="ghost disp" id="overMenu" data-t="menu"></button></div>
  </div></section>

  <section id="pause" class="screen hide"><div class="panel"><h2 class="disp" data-t="paused"></h2>
    <div class="row"><button class="cta disp" id="resumeBtn" data-t="resume"></button><button class="ghost disp" id="pauseMenu" data-t="menu"></button></div></div></section>
</div>

chakra:{
 en:{name:'Konark Chakra',tag:'Guard the diya’s flame through the night, then unleash the Sun wheel.',
  hist:'The Konark Sun Temple in Odisha was built in the 13th century by King Narasimhadeva I as a giant stone chariot of Surya, the Sun god. Its 24 carved wheels also work as sundials.',

 hi:{name:'कोणार्क चक्र',tag:'रात भर दीये की लौ बचाएँ, फिर सूर्य चक्र छोड़ें।',
  hist:'ओडिशा का कोणार्क सूर्य मंदिर 13वीं सदी में राजा नरसिंहदेव प्रथम ने सूर्य देव के विशाल पत्थर के रथ के रूप में बनवाया था। इसके 24 नक्काशीदार पहिये धूपघड़ी का काम भी करते हैं।',

 ta:{name:'கொனார்க் சக்கரம்',tag:'இரவு முழுவதும் தீபச் சுடரைக் காத்து, பின் சூரிய சக்கரத்தை விடுவியுங்கள்.',
  hist:'ஒடிசாவின் கொனார்க் சூரியன் கோயில் 13ஆம் நூற்றாண்டில் மன்னர் முதலாம் நரசிம்மதேவனால் சூரிய தேவனின் மாபெரும் கல் தேராகக் கட்டப்பட்டது. அதன் 24 செதுக்கப்பட்ட சக்கரங்கள் சூரியக் கடிகாரங்களாகவும் செயல்படுகின்றன.',
  how:'நிழல்களைத் தவிர்த்து நகருங்கள். அவற்றின் அருகே சென்று காம்போ சேருங்கள், தாமரைகளைச் சேகரித்து, கிளிக், ஸ்பேஸ் அல்லது பொத்தானால் சக்கரத்தை விடுங்கள்.',

 bn:{name:'কোনার্ক চক্র',tag:'সারা রাত প্রদীপের শিখা রক্ষা করুন, তারপর সূর্যচক্র ছাড়ুন।',
  hist:'ওড়িশার কোনার্ক সূর্য মন্দির ত্রয়োদশ শতকে রাজা প্রথম নরসিংহদেব সূর্যদেবের বিশাল পাথরের রথ হিসেবে তৈরি করেন। এর ২৪টি খোদাই করা চাকা সূর্যঘড়ির কাজও করে।',
  how:'ছায়াগুলো এড়িয়ে চলুন। গা ঘেঁষে বেরিয়ে কম্বো বাড়ান, পদ্ম সংগ্রহ করুন, তারপর ক্লিক, স্পেস বা বোতাম দিয়ে চক্র ছাড়ুন।',
  raga:'রাগ ভৈরব · তিনতাল',facts:['কোনার্কের প্রতিটি চাকায় ৮টি মোটা ও ৮টি সরু স্পোক আছে। স্পোকের ছায়া দেখে দিনের সময় বোঝা যায়।','এখন বাজছে রাগ ভৈরব, ভোরের রাগ, যা সূর্যোদয়ের সময় গাওয়া হয়।']},
 te:{name:'కోణార్క్ చక్రం',tag:'రాత్రంతా దీపం జ్యోతిని కాపాడి, తర్వాత సూర్య చక్రాన్ని విడుదల చేయండి.',
  hist:'ఒడిశాలోని కోణార్క్ సూర్య దేవాలయాన్ని 13వ శతాబ్దంలో రాజు మొదటి నరసింహదేవుడు సూర్యదేవుని భారీ రాతి రథంగా నిర్మించాడు. దాని 24 చెక్కిన చక్రాలు సూర్య గడియారాలుగా కూడా పనిచేస్తాయి.',

patang:{
 en:{name:'Patang Yuddh',tag:'Win the sky on Makar Sankranti. Cut rival kites with your manjha.',
  hist:'Kite fights fill India’s skies on Makar Sankranti and Uttarayan. Flyers coat their string, the manjha, with rice paste and powdered glass to cut rivals, and shout “Kai po che!” or “Bo kata!” when a kite falls.',
  how:'Steer your kite across a rival’s string to cut it. Keep rival kites off your own string. Brush close for combo, grab til-gud laddoos, then fill the meter and switch on glass manjha.',

 hi:{name:'पतंग युद्ध',tag:'मकर संक्रांति पर आसमान जीतें। मांझे से दूसरों की पतंग काटें।',
  hist:'मकर संक्रांति और उत्तरायण पर भारत का आसमान पतंगों की लड़ाई से भर जाता है। पतंगबाज़ अपने धागे, यानी मांझे, पर चावल की लेई और पिसा काँच चढ़ाते हैं और पतंग कटने पर “काई पो छे!” या “बो काटा!” चिल्लाते हैं।',
  how:'अपनी पतंग को दूसरे के धागे के पार ले जाकर काटें। उनकी पतंगों को अपने धागे से दूर रखें। पास से निकलकर कॉम्बो बनाएँ, तिल-गुड़ के लड्डू लें, फिर मीटर भरकर काँच वाला मांझा चलाएँ।',
  raga:'राग यमन · कहरवा',facts:['अहमदाबाद का अंतरराष्ट्रीय पतंग महोत्सव हर जनवरी दुनिया भर के पतंगबाज़ों को बुलाता है।','अभी बज रहा राग यमन शाम का राग है, जो छतों पर सूरज ढलते समय गाया जाता है।']},
 ta:{name:'பட்டப் போர்',tag:'மகர சங்கராந்தியில் வானை வெல்லுங்கள். மாஞ்சா நூலால் எதிரிப் பட்டங்களை அறுங்கள்.',
  hist:'மகர சங்கராந்தி, உத்தராயணத்தில் இந்திய வானம் பட்டப் போர்களால் நிறைகிறது. வீரர்கள் தங்கள் நூலான மாஞ்சாவில் அரிசிப் பசையும் கண்ணாடித் தூளும் பூசி, பட்டம் விழும்போது “காய் போ சே!” அல்லது “போ கட்டா!” என்று கூவுவார்கள்.',
  how:'உங்கள் பட்டத்தை எதிரி நூலின் குறுக்கே செலுத்தி அறுங்கள். எதிரிப் பட்டங்கள் உங்கள் நூலைத் தொடாமல் பாருங்கள். அருகில் சென்று காம்போ சேர்த்து, எள்ளுருண்டைகளை எடுத்து, மீட்டர் நிறைந்ததும் கண்ணாடி மாஞ்சாவை இயக்குங்கள்.',
  raga:'யமன் ராகம் · கேஹர்வா',facts:['அகமதாபாத்தின் சர்வதேச பட்டத் திருவிழா ஒவ்வொரு ஜனவரியிலும் உலகெங்கிலுமிருந்து பட்டம் விடுவோரை ஈர்க்கிறது.','இப்போது ஒலிக்கும் யமன் மாலை ராகம்; கூரைகளின் மேல் சூரியன் மறையும்போது பாடப்படுவது.']},
 bn:{name:'ঘুড়ির লড়াই',tag:'মকর সংক্রান্তিতে আকাশ জয় করুন। মাঞ্জা দিয়ে প্রতিপক্ষের ঘুড়ি কাটুন।',
  hist:'মকর সংক্রান্তি ও উত্তরায়ণে ভারতের আকাশ ঘুড়ির লড়াইয়ে ভরে যায়। ঘুড়িবাজরা তাদের সুতো, অর্থাৎ মাঞ্জায় ভাতের মাড় আর কাচের গুঁড়ো মাখান এবং ঘুড়ি কাটলে চেঁচিয়ে ওঠেন “ভো কাট্টা!”',
  how:'প্রতিপক্ষের সুতোর উপর দিয়ে ঘুড়ি নিয়ে গিয়ে কাটুন। তাদের ঘুড়ি যেন আপনার সুতো ছুঁতে না পারে। গা ঘেঁষে কম্বো বানান, তিলের নাড়ু নিন, তারপর মিটার ভরলে কাচের মাঞ্জা চালু করুন।',
  raga:'রাগ ইমন · কাহারবা',facts:['বাংলায় বিশ্বকর্মা পুজোর দিন ঘুড়ি ওড়ানোর রেওয়াজ আছে।','এখন বাজছে রাগ ইমন, সন্ধ্যার রাগ, যা ছাদের উপর সূর্য ডোবার সময় গাওয়া হয়।']},
 te:{name:'గాలిపటాల యుద్ధం',tag:'మకర సంక్రాంతికి ఆకాశాన్ని గెలవండి. మాంజాతో ప్రత్యర్థుల పటాలను తెంచండి.',
  hist:'మకర సంక్రాంతి, ఉత్తరాయణ సమయంలో భారత ఆకాశం గాలిపటాల పోరుతో నిండిపోతుంది. పోటీదారులు తమ దారం మాంజాకు అన్నం గంజి, గాజు పొడి పూసి, పటం తెగినప్పుడు “కాయ్ పో చే!” లేదా “బో కాటా!” అని అరుస్తారు.',
  how:'మీ పటాన్ని ప్రత్యర్థి దారం మీదుగా నడిపి తెంచండి. వారి పటాలు మీ దారాన్ని తాకకుండా చూసుకోండి. దగ్గరగా వెళ్లి కాంబో పెంచండి, నువ్వుల లడ్డూలు పట్టండి, మీటర్ నిండాక గాజు మాంజాను ఆన్ చేయండి.',
  raga:'యమన్ రాగం · కహర్వా',facts:['తెలుగు రాష్ట్రాల్లో సంక్రాంతికి గాలిపటాలు ఎగురవేయడం పెద్ద సంప్రదాయం.','ఇప్పుడు వినిపిస్తున్న యమన్ సాయంత్రపు రాగం; పైకప్పులపై సూర్యుడు అస్తమించే వేళ పాడతారు.']}},
gilli:{
 en:{name:'Gilli Danda',tag:'Flip, strike, and send the gilli flying past the fielders.',
  hist:'Gilli-danda is one of South Asia’s oldest street games, played with just two sticks: a long danda and a small gilli tapered at both ends. Some historians see it as a distant cousin of cricket and baseball.',
  how:'Tap once to flip the gilli, tap again to strike. Hit it while it rises for a low drive, or as it falls for a high lob. Strike inside the gold zone for a perfect hit, and keep it away from the fielders.',
  raga:'Raag Khamaj · Dadra',facts:['A tap on the gilli’s tapered tip makes it jump into the air. That is the whole trick of the game.','India has many names for it: viti-dandu in Marathi, kitti-pullu in Tamil, chinni-dandu in Kannada, dang-guli in Bengali and goti-billa in Telugu.']},
 hi:{name:'गिल्ली डंडा',tag:'गिल्ली उछालें, मारें और क्षेत्ररक्षकों के ऊपर से उड़ा दें।',
  hist:'गिल्ली डंडा दक्षिण एशिया के सबसे पुराने गली खेलों में से एक है, जो सिर्फ़ दो लकड़ियों से खेला जाता है: लंबा डंडा और दोनों सिरों पर नुकीली छोटी गिल्ली। कुछ इतिहासकार इसे क्रिकेट और बेसबॉल का दूर का रिश्तेदार मानते हैं।',
  how:'गिल्ली उछालने के लिए एक बार टैप करें, मारने के लिए फिर टैप करें। ऊपर जाती गिल्ली पर नीचा शॉट, नीचे आती पर ऊँचा शॉट। सुनहरे हिस्से में मारें तो परफ़ेक्ट शॉट, और क्षेत्ररक्षकों से बचें।',
  raga:'राग खमाज · दादरा',facts:['गिल्ली के नुकीले सिरे पर चोट लगते ही वह हवा में उछल जाती है। यही इस खेल की असली तरकीब है।','भारत में इसके कई नाम हैं: मराठी में विटी-दांडू, तमिल में किट्टी-पुल्लु, कन्नड़ में चिन्नी-दांडु, बांग्ला में डांग-गुली और तेलुगु में गोटी-बिल्ला।']},
 ta:{name:'கிட்டிப்புள்',tag:'கிட்டியைத் தூக்கி அடித்து, களத்தடுப்பாளர்களைத் தாண்டிப் பறக்கவிடுங்கள்.',
  hist:'கிட்டிப்புள் (கில்லி தாண்டு) தெற்காசியாவின் மிகப் பழமையான தெரு விளையாட்டுகளில் ஒன்று; நீண்ட குச்சியும் இரு முனையும் கூர்மையான சிறு கிட்டியும் போதும். சில வரலாற்றாசிரியர்கள் இதனைக் கிரிக்கெட், பேஸ்பாலின் தொலைதூர உறவாகக் கருதுகிறார்கள்.',
  how:'கிட்டியைத் தூக்க ஒருமுறை தட்டுங்கள், அடிக்க மீண்டும் தட்டுங்கள். எழும்போது அடித்தால் தாழ்வான அடி, விழும்போது அடித்தால் உயரமான அடி. தங்க மண்டலத்தில் அடித்தால் சிறப்பு அடி; களத்தடுப்பாளர்களைத் தவிருங்கள்.',
  raga:'காமாஜ் ராகம் · தாத்ரா',facts:['கிட்டியின் கூர்மையான முனையில் தட்டினால் அது காற்றில் எழும். இதுவே ஆட்டத்தின் முழு நுணுக்கம்.','இந்தியாவில் இதற்குப் பல பெயர்கள்: மராத்தியில் விட்டி-தாண்டு, தமிழில் கிட்டிப்புள், கன்னடத்தில் சின்னி-தாண்டு, வங்காளத்தில் டாங்-குலி, தெலுங்கில் கோட்டி-பில்லா.']},
 bn:{name:'ডাংগুলি',tag:'গুলি তুলুন, মারুন, আর ফিল্ডারদের মাথার উপর দিয়ে উড়িয়ে দিন।',
  hist:'ডাংগুলি দক্ষিণ এশিয়ার সবচেয়ে পুরনো রাস্তার খেলাগুলোর একটি, যা খেলতে লাগে শুধু দুটো লাঠি: লম্বা ডাং আর দুই মাথা সূচালো ছোট গুলি। কিছু ইতিহাসবিদ একে ক্রিকেট ও বেসবলের দূরসম্পর্কের আত্মীয় মনে করেন।',
  how:'গুলি তুলতে একবার ট্যাপ করুন, মারতে আবার ট্যাপ করুন। ওঠার সময় মারলে নিচু শট, নামার সময় মারলে উঁচু শট। সোনালি অংশে মারলে পারফেক্ট শট, আর ফিল্ডারদের এড়িয়ে চলুন।',
  raga:'রাগ খাম্বাজ · দাদরা',facts:['গুলির সূচালো মাথায় আঘাত করলেই সেটা লাফিয়ে শূন্যে ওঠে। এটাই খেলার আসল কৌশল।','ভারত জুড়ে এর নানা নাম: মারাঠিতে বিটি-দান্ডু, তামিলে কিট্টিপুল, কন্নড়ে চিন্নি-দান্ডু, তেলুগুতে গোটি-বিল্লা আর বাংলায় ডাংগুলি।']},
 te:{name:'గోటీబిళ్ల',tag:'బిళ్లను ఎగరేసి, కొట్టి, ఫీల్డర్ల పైనుంచి ఎగిరిపోయేలా చేయండి.',
  hist:'గోటీబిళ్ల (గిల్లీ దండా) దక్షిణాసియాలోని అతి పురాతన వీధి ఆటల్లో ఒకటి; పొడవైన కర్ర, రెండు చివరలూ మొనదేలిన చిన్న బిళ్ల చాలు. కొందరు చరిత్రకారులు దీనిని క్రికెట్, బేస్‌బాల్‌లకు దూరపు బంధువుగా భావిస్తారు.',
  how:'బిళ్లను ఎగరేయడానికి ఒకసారి తాకండి, కొట్టడానికి మళ్లీ తాకండి. పైకి లేస్తున్నప్పుడు కొడితే తక్కువ ఎత్తు షాట్, కిందకు పడుతున్నప్పుడు కొడితే ఎత్తైన షాట్. బంగారు భాగంలో కొడితే పర్ఫెక్ట్ షాట్; ఫీల్డర్లను తప్పించుకోండి.',
  raga:'ఖమాజ్ రాగం · దాద్రా',facts:['బిళ్ల మొనదేలిన చివరపై కొడితే అది గాలిలోకి ఎగురుతుంది. ఆట మొత్తం రహస్యం అదే.','భారతదేశమంతటా దీనికి ఎన్నో పేర్లు: మరాఠీలో విటీ-దాండూ, తమిళంలో కిట్టిపుల్, కన్నడలో చిన్నీ-దాండు, బెంగాలీలో డాంగ్-గులి, తెలుగులో గోటీబిళ్ల.']}},
moksha:{
 en:{name:'Moksha Patam',tag:'Climb the ancient board of virtues. Ride the ladders, beware the snakes.',
  hist:'Moksha Patam, also called Gyan Chaupar, taught that good deeds lift us up and vices drag us down: ladders stood for virtues and snakes for vices. It travelled to England in the 19th century and became Snakes and Ladders.',
  how:'Bounce from square to square and steer left or right. Ladders of virtue carry you up, snakes of vice drag you down. Collect diyas to fill the meter, then call Garuda, the snake-fighting eagle, for a giant leap.',
  raga:'Raag Kafi · Teentaal',facts:['The game is often credited to the 13th-century saint Dnyaneshwar.','On old boards the final square, 100, stood for Moksha, liberation from the cycle of rebirth.']},
 hi:{name:'मोक्ष पटम',tag:'सदगुणों के प्राचीन बोर्ड पर चढ़ें। सीढ़ियाँ पकड़ें, साँपों से बचें।',
  hist:'मोक्ष पटम, जिसे ज्ञान चौपड़ भी कहते हैं, सिखाता था कि अच्छे कर्म ऊपर उठाते हैं और बुराइयाँ नीचे खींचती हैं: सीढ़ियाँ सदगुण थीं और साँप दुर्गुण। 19वीं सदी में यह इंग्लैंड पहुँचा और स्नेक्स एंड लैडर्स बन गया।',
  how:'एक खाने से दूसरे पर उछलें और बाएँ-दाएँ मुड़ें। सदगुणों की सीढ़ियाँ ऊपर ले जाती हैं, दुर्गुणों के साँप नीचे। दीये इकट्ठा कर मीटर भरें, फिर बड़ी छलाँग के लिए साँपों के शत्रु गरुड़ को बुलाएँ।',
  raga:'राग काफ़ी · तीनताल',facts:['इस खेल का श्रेय अक्सर 13वीं सदी के संत ज्ञानेश्वर को दिया जाता है।','पुराने बोर्डों में आख़िरी खाना, 100, मोक्ष यानी जन्म-मृत्यु के चक्र से मुक्ति का प्रतीक था।']},
 ta:{name:'மோட்ச படம்',tag:'நற்பண்புகளின் பழம்பெரும் பலகையில் ஏறுங்கள். ஏணிகளில் ஏறுங்கள், பாம்புகளிடம் கவனம்.',
  hist:'ஞான சௌபர் என்றும் அழைக்கப்படும் மோட்ச படம், நற்செயல்கள் நம்மை உயர்த்தும், தீமைகள் கீழே இழுக்கும் என்று கற்பித்தது: ஏணிகள் நற்பண்புகள், பாம்புகள் தீய குணங்கள். 19ஆம் நூற்றாண்டில் இது இங்கிலாந்துக்குச் சென்று ஸ்நேக்ஸ் அண்ட் லேடர்ஸ் ஆனது.',
  how:'கட்டத்திலிருந்து கட்டத்துக்குத் தாவி இடம் வலம் திருப்புங்கள். நற்பண்பு ஏணிகள் மேலே கொண்டு செல்லும், தீய பாம்புகள் கீழே இழுக்கும். தீபங்களைச் சேகரித்து மீட்டரை நிரப்பி, பெரும் பாய்ச்சலுக்குப் பாம்புகளின் எதிரியான கருடனை அழையுங்கள்.',
  raga:'காபி ராகம் · தீன்தால்',facts:['இந்த விளையாட்டு பெரும்பாலும் 13ஆம் நூற்றாண்டு துறவி ஞானேஸ்வருக்கு உரியதாகக் கூறப்படுகிறது.','பழைய பலகைகளில் கடைசிக் கட்டமான 100, மோட்சத்தை, அதாவது பிறவிச் சுழலிலிருந்து விடுதலையைக் குறித்தது.']},
 bn:{name:'মোক্ষ পটম',tag:'সদগুণের প্রাচীন বোর্ডে উঠুন। মই ধরুন, সাপ থেকে সাবধান।',

class Audio{
  constructor(){this.ctx=null;this.muted=store.get('mute',false);this.timer=null;this.energy=0;this.raga=null}
  init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return true}
    try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.5;
      const comp=this.ctx.createDynamicsCompressor();this.master.connect(comp);comp.connect(this.ctx.destination);
      this.mus=this.ctx.createGain();this.mus.gain.value=.8;this.mus.connect(this.master);
      const n=this.ctx.sampleRate,b=this.ctx.createBuffer(1,n,n),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.nbuf=b;
      if(this.pending){const r=this.pending;this.pending=null;this.play(r)}return true}catch(e){this.ctx=null;return false}}
  setMuted(m){this.muted=m;store.set('mute',m);if(this.master)this.master.gain.setTargetAtTime(m?0:.5,this.ctx.currentTime,.05)}
  tone(f,dur,type='sine',vol=.1,to=0,when=0,dest){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+Math.max(0,when),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+dur+.03)}
  noise(dur,vol=.15,f0=4000,f1=200,when=0,dest,type='lowpass'){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+Math.max(0,when),s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.nbuf;fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest||this.master);s.start(t,Math.random()*.5);s.stop(t+dur+.03)}
  /* tabla bols: dayan (right, pitched) + bayan (left, bass with pitch bend) */
  bol(b,w){const m=this.mus,sa=this.raga?this.raga.root*4:560;
    const na=()=>{this.tone(sa,.16,'sine',.13,0,w,m);this.tone(sa*2.01,.07,'triangle',.04,0,w,m)};
    const tin=()=>this.tone(sa*1.5,.1,'sine',.08,0,w,m);
    const ge=()=>this.tone(120,.38,'sine',.26,68,w,m);
    const ta=()=>{this.noise(.05,.1,7000,2500,w,m,'bandpass');this.tone(sa*1.12,.05,'square',.025,0,w,m)};
    const ke=()=>this.noise(.06,.13,700,150,w,m);
    ({dha:()=>{na();ge()},dhin:()=>{tin();ge()},na,tin,ta,ge,ke})[b]?.()}
  music(id){this.raga=RAGAS[id];if(!this.ctx){this.pending=id;return}this.play(id)}
  play(id){clearInterval(this.timer);const R=RAGAS[id];this.raga=R;if(!R||!this.ctx)return;
    let step=0,next=this.ctx.currentTime+.08,motif=[];const scale=[];for(let o=0;o<3;o++)R.scale.forEach(s=>scale.push(R.root*Math.pow(2,o+s/12)));
    const newMotif=()=>{let i=7+(Math.random()*4|0);motif=[];for(let k=0;k<8;k++){i=clamp(i+pick([-2,-1,-1,1,1,2,0,3]),3,scale.length-2);motif.push(k%4===3&&Math.random()<.4?-1:i)}};newMotif();
    this.timer=setInterval(()=>{const c=this.ctx;if(!c)return;const E=this.energy;
      while(next<c.currentTime+.18){const bpm=R.bpm*(1+E*.22),sd=60/bpm/2,w=next-c.currentTime,tl=R.taal,s=step%tl.length,bar=Math.floor(step/8);
        if(tl[s]!=='-')this.bol(tl[s],w);
        // tanpura: Pa Sa' Sa' Sa cycle, long triangle plucks
        if(step%4===0){const tp=[R.root*.75,R.root,R.root,R.root*.5][(step/4)%4];this.tone(tp,2.2,'triangle',.05,0,w,this.mus);this.tone(tp*2,1.6,'sine',.02,0,w,this.mus)}
        // bass synth on Sa / Pa
        if(id!=='hub'&&[0,3,6].includes(step%8))this.tone((bar%4===2?R.root*.75:R.root)/2,sd*1.6,'sawtooth',.06+E*.03,0,w,this.mus);
        // lead: raga motif, gets busier with energy
        if((id==='hub'?step%2===0:true)&&(E>.18||id==='hub')){const n=motif[step%8];if(n>=0){const f=scale[n]*(id==='hub'?1:2);this.tone(f,sd*(E>.6?.7:1.4),id==='hub'?'triangle':'square',id==='hub'?.035:.022+E*.012,0,w,this.mus)}}
        if(E>.55&&step%2===1){const n=motif[(step+3)%8];if(n>=0)this.tone(scale[n]*4,sd*.5,'triangle',.018,0,w,this.mus)}
        // manjira (finger cymbals) on beats as it heats up
        if(E>.35&&step%2===0)this.noise(.09,.035,12000,8000,w,this.mus,'highpass');
        if(step%16===15&&Math.random()<.5)newMotif();
        next+=sd;step++}},30)}
  stop(){clearInterval(this.timer);this.timer=null}
  // sfx
  graze(c){this.tone(900+Math.min(c,30)*35,.07,'triangle',.07)}
  pickup(i){[0,4,7].forEach((s,k)=>this.tone(560*Math.pow(2,(s+i)/12),.14,'triangle',.07,0,k*.05))}
  boom(){this.noise(.6,.32,6000,120);this.tone(90,.6,'sawtooth',.16,30);this.tone(300,.4,'square',.05,1400)}
  pop(i=0){this.tone(320+i*70,.09,'square',.05,120)}
  hit(){this.noise(.5,.4,3000,80);this.tone(160,.5,'sawtooth',.18,40)}
  up(){[0,4,7,12].forEach((s,k)=>this.tone(440*Math.pow(2,s/12),.2,'triangle',.08,0,k*.07))}
  down(){[0,-3,-6,-10].forEach((s,k)=>this.tone(520*Math.pow(2,s/12),.18,'sawtooth',.06,0,k*.08))}
  over(){[0,-3,-7,-12].forEach((s,k)=>this.tone(330*Math.pow(2,s/12),.45,'sawtooth',.09,0,k*.18))}
  start(){this.tone(200,.5,'sawtooth',.1,1200);this.noise(.4,.15,200,5000);this.bol('dha',0.02);this.bol('dha',0.2)}
  whack(q){this.noise(.12,.35,5000,800);this.tone(700+q*500,.18,'square',.08,200)}
  tick(){this.tone(1500,.03,'square',.03)}
}

/* ================= particles & popups ================= */
class Particles{
  constructor(){this.p=[]}
  emit(x,y,n,o={}){const cols=Array.isArray(o.col)?o.col:[o.col||COL.marigold];
    for(let i=0;i<n&&this.p.length<1300;i++){const a=(o.angle??0)+rand(-1,1)*(o.spread??Math.PI),s=rand(...(o.speed||[60,320]));
      this.p.push({x:x+(o.jx?rand(-o.jx,o.jx):0),y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:rand(...(o.life||[.4,.9])),size:rand(...(o.size||[1.5,3.5])),col:cols[i%cols.length],drag:o.drag??2.2,grav:o.grav??0,shape:o.shape||'spark',rot:rand(0,TAU),vr:rand(-8,8)})}}
  update(dt){const a=this.p;for(let i=a.length-1;i>=0;i--){const p=a[i];p.life+=dt;if(p.life>=p.max){a[i]=a[a.length-1];a.pop();continue}
    const k=Math.exp(-p.drag*dt);p.vx*=k;p.vy*=k;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
  draw(ctx){ctx.globalCompositeOperation='lighter';
    for(const p of this.p){const k=1-p.life/p.max;ctx.globalAlpha=k;ctx.strokeStyle=ctx.fillStyle=p.col;
      if(p.shape==='spark'){ctx.lineWidth=p.size*k+.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.stroke()}
      else if(p.shape==='petal'){ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.min(1,k*1.5);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.abs(Math.sin(p.rot*1.7))*.7+.3);ctx.beginPath();ctx.ellipse(0,0,p.size*1.6,p.size*.8,0,0,TAU);ctx.fill();ctx.restore();ctx.globalCompositeOperation='lighter'}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*k+.4,0,TAU);ctx.fill()}}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
}
/* ================= neon drawing kit ================= */
function glow(ctx,path,col,w=2,fill=.18){ctx.globalCompositeOperation='lighter';ctx.strokeStyle=col;
  ctx.globalAlpha=.2;ctx.lineWidth=w*3.4;ctx.stroke(path);ctx.globalAlpha=.55;ctx.lineWidth=w*1.6;ctx.stroke(path);
  ctx.globalAlpha=1;ctx.lineWidth=w*.6;ctx.strokeStyle='#fff';ctx.stroke(path);
  if(fill){ctx.globalAlpha=fill;ctx.fillStyle=col;ctx.fill(path)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function glowLine(ctx,pts,col,w=2,alpha=1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
  for(const [lw,a,c] of [[w*3.2,.18,col],[w*1.5,.5,col],[w*.55,1,'#fff']]){ctx.globalAlpha=a*alpha;ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.stroke()}ctx.restore()}
function sky(ctx,W,H,stops){const g=ctx.createLinearGradient(0,0,0,H);stops.forEach(([o,c])=>g.addColorStop(o,c));ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function starsDraw(ctx,stars,W,H,t){ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=.3+.7*Math.abs(Math.sin(t*1.2+s.p));ctx.fillRect(s.x*W,s.y*H,s.s,s.s)}ctx.globalAlpha=1}
const mkStars=(n,maxY=.6)=>Array.from({length:n},()=>({x:Math.random(),y:Math.random()*maxY,s:rand(.6,1.8),p:rand(0,TAU)}));
function stripedSun(r,px,c0,c1,c2){const c=document.createElement('canvas');c.width=c.height=Math.max(2,Math.ceil(r*2*px));const x=c.getContext('2d');x.scale(px,px);
  const g=x.createLinearGradient(0,0,0,r*2);g.addColorStop(0,c0);g.addColorStop(.55,c1);g.addColorStop(1,c2);x.fillStyle=g;x.beginPath();x.arc(r,r,r,0,TAU);x.fill();
  x.globalCompositeOperation='destination-out';for(let i=0;i<7;i++)x.fillRect(0,r*(1.05+i*.14),r*2,1.5+i*2);return c}
/* Konark wheel: 8 thick + 8 thin spokes, beaded rim */
function chakra(ctx,x,y,r,rot,col,lw=2,alpha=1){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;
  const p=new Path2D();p.arc(0,0,r,0,TAU);p.moveTo(r*.86,0);p.arc(0,0,r*.86,0,TAU);p.moveTo(r*.2,0);p.arc(0,0,r*.2,0,TAU);
  for(let i=0;i<8;i++){const a=i/8*TAU;p.moveTo(Math.cos(a)*r*.2,Math.sin(a)*r*.2);p.lineTo(Math.cos(a)*r*.86,Math.sin(a)*r*.86)}
  glow(ctx,p,col,lw,0);
  const q=new Path2D();for(let i=0;i<8;i++){const a=(i+.5)/8*TAU;q.moveTo(Math.cos(a)*r*.2,Math.sin(a)*r*.2);q.lineTo(Math.cos(a)*r*.86,Math.sin(a)*r*.86)}
  glow(ctx,q,col,lw*.45,0);

    const sr=Math.min(W,H)*.22*(1+beat*.015),sx=W>760?W*.72:W*.5,sy=hy-sr*.5;ctx.drawImage(this.hubSun,sx-sr,sy-sr,sr*2,sr*2);
    const tilt=this.hx!=null?(this.hx-sx)*.0008:0;chakra(ctx,sx,sy,sr*1.25,t*.12+tilt,COL.marigold,1.6,.75);chakra(ctx,sx,sy,sr*.55,-t*.3,'#fff3c4',1,.5);
    ctx.fillStyle='#14042c';ctx.beginPath();ctx.moveTo(0,hy);for(let i=0;i<=40;i++){const x=i/40*W;ctx.lineTo(x,hy-(Math.sin(i*1.7)*.5+.5)*H*.04-(i%7===3?H*.06:0))}ctx.lineTo(W,hy);ctx.fill();
    const g=ctx.createLinearGradient(0,hy,0,H);g.addColorStop(0,'#2a0a4e');g.addColorStop(1,'#08011a');ctx.fillStyle=g;ctx.fillRect(0,hy,W,H-hy);
    ctx.globalCompositeOperation='lighter';ctx.lineWidth=1.3;const sc=(t*.25)%1;for(let k=0;k<14;k++){const z=(k+sc)/14,y=hy+(H-hy)*Math.pow(z,2.3);ctx.globalAlpha=.1+.5*z;ctx.strokeStyle=k%2?COL.rani:COL.saffron;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.strokeStyle=COL.violet;for(let i=-16;i<=16;i++){ctx.globalAlpha=.32;ctx.beginPath();ctx.moveTo(W/2+i*W*.02,hy);ctx.lineTo(W/2+i*W*.16,H);ctx.stroke()}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    // drifting kites and lotuses over the hub
    for(let i=0;i<5;i++){const x=((t*14*(i%2?1:-1)+i*W/5)%(W+80)+W+80)%(W+80)-40,y=H*(.12+i*.09)+Math.sin(t+i)*10,c=KCOL[i];drawKite(ctx,x,y,10+i%3*3,Math.sin(t*1.3+i)*.2,c[0],c[1],c[0],t+i,.55)}
    for(let i=0;i<4;i++){lotus(ctx,(i+.5)*W/4+Math.sin(t*.6+i)*20,hy+(H-hy)*.55+Math.cos(t+i)*6,10,t+i,[COL.lotus,COL.marigold,COL.peacock,COL.rani][i])}}
  updateHud(force){const g=this.game;if(!g)return;const h=g.hud(),s=this.shown,L=T[this.lang];
    s.disp=(s.disp??h.score)+(h.score-(s.disp??h.score))*.25;const sc=Math.floor(Math.abs(h.score-s.disp)<1?h.score:s.disp);
    if(force||s.score!==sc){s.score=sc;$('#score').textContent=sc.toLocaleString()}
    const best=store.get('best_'+g.id,0);if(force||s.best!==best){s.best=best;$('#best').textContent=best?best.toLocaleString():'—'}
    const mt=(h.combo>0?'COMBO '+h.combo+'  ':'')+'×'+h.mult;if(force||s.mt!==mt){s.mt=mt;$('#mult').textContent=mt;$('#mult').classList.toggle('on',h.mult>1||h.combo>0)}
    const lv=h.lives==null?-1:h.lives;if(force||s.lives!==lv){s.lives=lv;$('#lives').innerHTML=lv<0?'':Array.from({length:Math.max(3,lv)},(_,i)=>`<i class="${i>=lv?'lost':''}"></i>`).join('')}
    const m=Math.round(h.meter),lab=h.label||(m>=100?g.meterName+' · '+L.ready:g.meterName+' '+m+'%');
    if(force||s.m!==m||s.lab!==lab){s.m=m;s.lab=lab;$('#meter i').style.width=m+'%';$('#meterWrap').classList.toggle('ready',m>=100||!!h.label);$('#meterTxt').textContent=lab}}
}
new App();
})();
